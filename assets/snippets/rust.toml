# [[snippet]] prefix, body (LSP snippet syntax), description

[[snippet]]
prefix = "fn"
description = "Function"
body = "fn ${1:name}(${2}) {\n\t$0\n}"

[[snippet]]
prefix = "test"
description = "Test function"
body = "#[test]\nfn ${1:name}() {\n\t$0\n}"

[[snippet]]
prefix = "impl"
description = "impl block"
body = "impl ${1:Type} {\n\t$0\n}"

[[snippet]]
prefix = "match"
description = "match expression"
body = "match ${1:value} {\n\t${2:_} => $0,\n}"
