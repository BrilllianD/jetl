# [[snippet]] prefix, body (LSP snippet syntax), description

[[snippet]]
prefix = "fn"
description = "Function"
body = "fn ${1:name}(${2}) {\n\t$0\n}"

[[snippet]]
prefix = "test"
description = "Test function"
body = "#[test]\nfn ${1:name}() {\n\t$0\n}"

[[snippet]]
prefix = "impl"
description = "impl block"
body = "impl ${1:Type} {\n\t$0\n}"

[[snippet]]
prefix = "match"
description = "match expression"
body = "match ${1:value} {\n\t${2:_} => $0,\n}"

[[snippet]]
prefix = "if"
description = "if block"
body = "if ${1:condition} {\n\t${TM_SELECTED_TEXT}$0\n}"

[[snippet]]
prefix = "while"
description = "while loop"
body = "while ${1:condition} {\n\t${TM_SELECTED_TEXT}$0\n}"

[[snippet]]
prefix = "ifelse"
description = "if/else"
body = "if ${1:condition} {\n\t${TM_SELECTED_TEXT}$0\n} else {\n\t$2\n}"

[[snippet]]
prefix = "for"
description = "for loop"
body = "for ${1:item} in ${2:iter} {\n\t${TM_SELECTED_TEXT}$0\n}"

[[snippet]]
prefix = "loop"
description = "infinite loop"
body = "loop {\n\t${TM_SELECTED_TEXT}$0\n}"

[[snippet]]
prefix = "unsafe"
description = "unsafe block"
body = "unsafe {\n\t${TM_SELECTED_TEXT}$0\n}"
