# [[snippet]] prefix, body (LSP snippet syntax), description

[[snippet]]
prefix = "func"
description = "Function"
body = "func ${1:name}(${2}) {\n\t$0\n}"

[[snippet]]
prefix = "iferr"
description = "if err != nil"
body = "if err != nil {\n\treturn ${1:err}\n}$0"

[[snippet]]
prefix = "if"
description = "if block"
body = "if ${1:condition} {\n\t${TM_SELECTED_TEXT}$0\n}"

[[snippet]]
prefix = "ifelse"
description = "if/else"
body = "if ${1:condition} {\n\t${TM_SELECTED_TEXT}$0\n} else {\n\t$2\n}"

[[snippet]]
prefix = "for"
description = "for loop"
body = "for ${1:condition} {\n\t${TM_SELECTED_TEXT}$0\n}"

[[snippet]]
prefix = "forr"
description = "for range loop"
body = "for ${1:_}, ${2:v} := range ${3:items} {\n\t${TM_SELECTED_TEXT}$0\n}"
