"alt-shift-b" = "git.log_new_branch"
"alt-shift-p" = "git.log_cherry_pick"
"alt-shift-r" = "git.log_revert"
"alt-shift-t" = "git.log_new_tag"
"alt-shift-d" = "git.log_delete_tag"
