"pagedown" = "palette.page_down"
"enter" = "palette.accept"
"esc" = "palette.cancel"
"backspace" = "palette.backspace"
"ctrl-backspace" = "palette.delete_word"
"ctrl-w" = "palette.delete_word"
"tab" = "palette.next_tab"
"shift-tab" = "palette.prev_tab"
# Deletes the selected scratch file (Scratch Files) or forgets the selected
# project (Recent Projects); elsewhere it deletes forward in the query, like
# Delete.
"shift-delete" = "palette.delete_item"

# Reserved for the future vim mode (inert unless [keymap] mode = "vim").
[mode.normal]
"i" = "mode.insert"
"v" = "mode.visual"
"h" = "editor.left"
"j" = "editor.down"
"k" = "editor.up"
"l" = "editor.right"
"g g" = "editor.doc_start"
"d d" = "editor.delete_line"
"u" = "editor.undo"
"ctrl-r" = "editor.redo"

[mode.insert]
"esc" = "mode.normal"
