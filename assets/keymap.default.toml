# While the Terminal window (Alt+F12) has focus every key goes to the shell
# except the ones in this table, which is the only one consulted there (add
# keys to keep them for jetl, "none" gives one to the shell), and Esc Esc: a
# single Esc reaches the shell, a second one within the double click interval
# focuses the editor.
[terminal]
"alt-f12" = "tool_window.terminal"
"ctrl-shift-up" = "tool_window.stretch_up"
"ctrl-shift-down" = "tool_window.stretch_down"
"ctrl-v" = "editor.paste"

# The Local History window (Alt+Shift+H): typing filters the snapshot list,
# Esc clears the filter first.
[local_history]
"up" = "local_history.up"
"down" = "local_history.down"
"pageup" = "local_history.page_up"
"pagedown" = "local_history.page_down"
"home" = "local_history.home"
"end" = "local_history.end"
"left" = "local_history.left"
"right" = "local_history.right"
"tab" = "local_history.next_section"
"enter" = "local_history.open_file"
# The project's files with history; from a file's history, back to them.
# With a filter typed, Backspace edits the filter first.
"backspace" = "local_history.files"
"f7" = "local_history.next_change"
"shift-f7" = "local_history.prev_change"
"alt-u" = "local_history.toggle_diff_layout"
"alt-f" = "local_history.toggle_diff_collapse"
"f5" = "local_history.refresh"
"alt-r" = "local_history.revert"
# The diff's selected changes: F7 picks one, Shift+Up/Down (or a Shift or
# Ctrl click) grows the selection, Ctrl+A takes them all.
"ctrl-alt-z" = "local_history.revert_changes"
"shift-up" = "local_history.extend_selection_up"
"shift-down" = "local_history.extend_selection_down"
"ctrl-a" = "local_history.select_all_changes"
# A line cursor in the diff: Alt+Up/Down moves it, with Shift it grows the
# selected lines, and Revert Changes then reverts only those lines. A double
# click on a changed row sets it; Esc leaves line mode.
"alt-up" = "local_history.line_up"
"alt-down" = "local_history.line_down"
"alt-shift-up" = "local_history.line_extend_up"
"alt-shift-down" = "local_history.line_extend_down"
"alt-l" = "local_history.put_label"
"delete" = "local_history.remove_label"
"shift-f10" = "local_history.context_menu"
"esc" = "local_history.escape"

