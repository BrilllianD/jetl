# jetl default keymap (JetBrains-like).
# Copy entries you want to change into ~/.config/jetl/keymap.toml.
# Value "none" removes a default binding.
# Key grammar: [ctrl-][alt-][shift-]<key>; space-separated combos form chords.

[global]
# Settings (JetBrains). In the Git window Ctrl+Alt+S stashes; File > Settings… works there.
"ctrl-alt-s" = "app.settings"
"alt-1" = "tool_window.project"
"alt-2" = "tool_window.worktrees"
"alt-9" = "tool_window.git"
"alt-3" = "tool_window.find"
"alt-7" = "tool_window.structure"
"alt-4" = "tool_window.run"
"alt-6" = "tool_window.problems"
"alt-f12" = "tool_window.terminal"
# JetBrains has no default key for the Event Log; Alt+Shift+L works in
# legacy terminals too.
"alt-shift-l" = "tool_window.event_log"
"ctrl-shift-f" = "find.in_files"
"ctrl-shift-r" = "find.replace_in_files"
# Ctrl+Shift+F/R need the kitty protocol (legacy terminals send Ctrl+F/R);
# Alt+3 opens the Find window anywhere, Alt+R there shows the replacement.
"ctrl-alt-down" = "find.next_result"
"ctrl-alt-up" = "find.prev_result"
# Run configurations, JetBrains-style: Alt+Shift+F10 picks one and runs it,
# Shift+F10 runs the selected one (the tree, Git and Local History windows
# keep Shift+F10 for their context menu), Ctrl+F5 reruns the last run (also a
# test run), Ctrl+F2 stops it. F-keys with modifiers arrive without the kitty
# protocol; GNOME Terminal keeps Shift+F10 for itself: use the Run menu there.
# F4/Shift+F4 step through the problems in its output from anywhere; in the
# Run window Ctrl+Alt+Down/Up do the same.
"alt-shift-f10" = "run.pick"
"shift-f10" = "run.run_selected"
"ctrl-f5" = "run.rerun"
# Ctrl+Shift+F10 runs the test at the caret (Run menu and F1 where the terminal keeps the key).
"ctrl-shift-f10" = "run.test_at_caret"
"ctrl-f2" = "run.stop"
"f4" = "run.next_problem"
"shift-f4" = "run.prev_problem"
"alt-0" = "git.commit_box"
"ctrl-k" = "git.commit_box"
"ctrl-shift-k" = "git.push"
# Legacy terminals and tmux do not deliver Ctrl+Shift+K; Alt+Shift+K pushes too.
"alt-shift-k" = "git.push"
"ctrl-t" = "git.pull"
"ctrl-shift-n" = "palette.files"
"ctrl-n" = "palette.files"
"shift shift" = "palette.search_everywhere"
# Shift Shift needs the kitty protocol; Alt+S is the legacy fallback.
"alt-s" = "palette.search_everywhere"
"ctrl-shift-a" = "palette.actions"
"ctrl-shift-p" = "palette.actions"
# Ctrl+Shift+A/P need the kitty protocol; F1 is the legacy fallback.
"f1" = "palette.actions"
"ctrl-e" = "palette.recent_files"
"alt-shift-e" = "palette.recent_projects"
"ctrl-alt-shift-n" = "palette.symbols"
# Ctrl+Alt+Shift+N needs the kitty protocol (legacy terminals send
# Ctrl+Alt+N); Alt+Shift+N is the legacy fallback.
"alt-shift-n" = "palette.symbols"
"ctrl-tab" = "editor.switcher"
"alt-right" = "editor.next_tab"
"alt-left" = "editor.prev_tab"
"ctrl-f4" = "editor.close_tab"
"ctrl-w" = "editor.close_tab"
# JetBrains has no default keys for these; Alt+Shift+Left/Right mirror
# Alt+Shift+Up/Down (move line) and work in legacy terminals too. Close
# others and close all but pinned are in the tab bar's right-click menu.
"alt-shift-left" = "editor.move_tab_left"
"alt-shift-right" = "editor.move_tab_right"
"alt-shift-p" = "editor.toggle_pin_tab"
# Split panes. JetBrains has no default keys for these; Ctrl+\ is avoided
# (legacy terminals send it as Ctrl+4). The window manager may take
# Alt+Tab, and Alt+Shift+Tab needs the kitty protocol: the View menu and the
# action palette have the same commands.
"alt-backslash" = "editor.split_right"
"alt-minus" = "editor.split_down"
"alt-tab" = "editor.next_group"
"alt-shift-tab" = "editor.prev_group"
"ctrl-shift-f12" = "tool_window.hide_all"
"shift-esc" = "tool_window.hide_focused"
# Shift+Esc needs the kitty protocol; Alt+Shift+Q works in legacy terminals and tmux.
"alt-shift-q" = "tool_window.hide_focused"
# Resize the focused tool window: Left/Right move a left window's edge,
# Up/Down a bottom window's. The editor keeps Ctrl+Shift+Left/Right for word
# selection (its table wins), and Up/Down do nothing while it has focus.
"ctrl-shift-left" = "tool_window.stretch_left"
"ctrl-shift-right" = "tool_window.stretch_right"
"ctrl-shift-up" = "tool_window.stretch_up"
"ctrl-shift-down" = "tool_window.stretch_down"
# The main menu bar, as F10 in JetBrains on Linux; F10 again closes it.
"f10" = "app.main_menu"
# JetBrains has no default key for Zen mode; Alt+Shift+Z works in legacy
# terminals too.
"alt-shift-z" = "app.zen"
"ctrl-`" = "git.branches_popup"
# Legacy terminals send Ctrl+` as NUL, which crossterm reports as Ctrl+Space.
"ctrl-space" = "git.branches_popup"
"alt-f1" = "tree.select_in_project"
"alt-h" = "git.file_history"
# Local History of the file (the selected tree entry when the tree has focus)
# in its tool window; JetBrains has no default key.
"alt-shift-h" = "editor.local_history"
"ctrl-q" = "app.quit"
"f5" = "app.refresh"
"ctrl-s" = "editor.save"
# Paste reads the system clipboard (wl-paste, xclip or xsel) into the focused
# text field: editor, find fields, commit message, palette, dialogs. The
# terminal's own paste shortcut (Ctrl+Shift+V, Shift+Insert) also works.
"ctrl-v" = "editor.paste"
"ctrl-shift-s" = "editor.save_all"
# Alt+Shift+W ("write all") saves all in legacy terminals and tmux. The editor
# find bar reads Alt+W as Whole Words while it has focus.
"alt-shift-w" = "editor.save_all"
# No Save As key in JetBrains; Alt+Shift+S sits next to Save All and works
# in legacy terminals and tmux.
"alt-shift-s" = "editor.save_as"
# New Scratch File, as in JetBrains. Legacy terminals and tmux send the
# modified Insert key too. Scratch Files has no key (File menu, Find Action).
"ctrl-alt-shift-insert" = "editor.new_scratch"
"f12" = "app.debug_panic"
# Numbered bookmarks (Ctrl+F11 sets one), JetBrains-style. Ctrl+digit needs
# the kitty protocol for 0-3, 8 and 9: legacy terminals send Ctrl+0, 1 and 9
# as plain digits, Ctrl+2 as Ctrl+Space, Ctrl+3 as Esc and Ctrl+8 as
# Backspace. Alt+B then the digit works everywhere. Legacy terminals send
# Ctrl+/ and Ctrl+7 as the same byte, read as Ctrl+/ (Comment with Line
# Comment), so bookmark 7 is Alt+B 7 there; with the kitty protocol Ctrl+7
# jumps everywhere.
"ctrl-0" = "editor.goto_bookmark_0"
"ctrl-1" = "editor.goto_bookmark_1"
"ctrl-2" = "editor.goto_bookmark_2"
"ctrl-3" = "editor.goto_bookmark_3"
"ctrl-4" = "editor.goto_bookmark_4"
"ctrl-5" = "editor.goto_bookmark_5"
"ctrl-6" = "editor.goto_bookmark_6"
"ctrl-7" = "editor.goto_bookmark_7"
"ctrl-8" = "editor.goto_bookmark_8"
"ctrl-9" = "editor.goto_bookmark_9"
"alt-b 0" = "editor.goto_bookmark_0"
"alt-b 1" = "editor.goto_bookmark_1"
"alt-b 2" = "editor.goto_bookmark_2"
"alt-b 3" = "editor.goto_bookmark_3"
"alt-b 4" = "editor.goto_bookmark_4"
"alt-b 5" = "editor.goto_bookmark_5"
"alt-b 6" = "editor.goto_bookmark_6"
"alt-b 7" = "editor.goto_bookmark_7"
"alt-b 8" = "editor.goto_bookmark_8"
"alt-b 9" = "editor.goto_bookmark_9"

[editor]
"enter" = "editor.newline"
"tab" = "editor.tab"
"shift-tab" = "editor.unindent"
"backspace" = "editor.backspace"
"delete" = "editor.delete"
"ctrl-backspace" = "editor.delete_word_back"
"ctrl-delete" = "editor.delete_word_forward"
"left" = "editor.left"
"right" = "editor.right"
"up" = "editor.up"
"down" = "editor.down"
"ctrl-left" = "editor.word_left"
"ctrl-right" = "editor.word_right"
"home" = "editor.line_start"
"end" = "editor.line_end"
"pageup" = "editor.page_up"
"pagedown" = "editor.page_down"
"ctrl-home" = "editor.doc_start"
"ctrl-end" = "editor.doc_end"
"shift-left" = "editor.left_extend"
"shift-right" = "editor.right_extend"
"shift-up" = "editor.up_extend"
"shift-down" = "editor.down_extend"
"ctrl-shift-left" = "editor.word_left_extend"
"ctrl-shift-right" = "editor.word_right_extend"
"shift-home" = "editor.line_start_extend"
"shift-end" = "editor.line_end_extend"
"shift-pageup" = "editor.page_up_extend"
"shift-pagedown" = "editor.page_down_extend"
"ctrl-shift-home" = "editor.doc_start_extend"
"ctrl-shift-end" = "editor.doc_end_extend"
"ctrl-z" = "editor.undo"
"ctrl-shift-z" = "editor.redo"
# Alt+Y redoes in legacy terminals and tmux (Ctrl+Y is Delete Line).
"alt-y" = "editor.redo"
"ctrl-y" = "editor.delete_line"
"ctrl-d" = "editor.duplicate_line"
"ctrl-f" = "editor.find"
"ctrl-r" = "editor.replace"
"f3" = "editor.find_next"
"shift-f3" = "editor.find_prev"
"ctrl-g" = "editor.goto_line"
"ctrl-a" = "editor.select_all"
"ctrl-c" = "editor.copy"
"ctrl-x" = "editor.cut"
# Legacy terminals send Ctrl+/ as 0x1F, which crossterm reports as Ctrl+7;
# jetl reads it as Ctrl+/ unless the kitty protocol is active.
"ctrl-/" = "editor.toggle_comment"
# Ctrl+Shift+/ needs the kitty protocol, which reports the shifted key, so it
# arrives as Ctrl+? (US layout). "ctrl-shift-/" would mean Ctrl+/ here.
"ctrl-?" = "editor.toggle_block_comment"
"ctrl-shift-m" = "editor.goto_bracket"
"alt-shift-up" = "editor.move_line_up"
"alt-shift-down" = "editor.move_line_down"
"ctrl-shift-j" = "editor.join_lines"
"ctrl-shift-u" = "editor.toggle_case"
"ctrl-alt-w" = "editor.expand_selection"
"ctrl-alt-shift-w" = "editor.shrink_selection"
# Multiple carets. Ctrl+Alt+Shift+J needs the kitty protocol; Ctrl+Alt+J is
# the legacy fallback. Clone Caret Above/Below have no key (F1, Edit menu).
"alt-j" = "editor.add_next_occurrence"
"alt-shift-j" = "editor.unselect_occurrence"
"ctrl-alt-shift-j" = "editor.select_all_occurrences"
"ctrl-alt-j" = "editor.select_all_occurrences"
# Column selection: Alt+drag makes a block; in column selection mode a plain
# drag and Shift+arrows, Home and End do too.
"alt-shift-insert" = "editor.toggle_column_mode"
# Code folding. Ctrl+Alt+Minus/Equals act recursively; Ctrl+Shift+Minus
# (collapse all) arrives as Ctrl+_ with the kitty protocol. Legacy terminals
# send Ctrl+- as 0x1F (Ctrl+7, toggle comment) and Ctrl+= and Ctrl+. as
# plain text: Alt+, (collapse), Alt+. (expand), Alt+< (collapse all),
# Alt+> (expand all), Alt+Shift+F (fold selection), Alt+{ (collapse
# recursively) and Alt+} (expand recursively) work there. The View menu has
# them too.
"ctrl-minus" = "editor.fold_collapse"
"ctrl-=" = "editor.fold_expand"
"ctrl-+" = "editor.fold_expand"
"ctrl-alt-minus" = "editor.fold_collapse_recursive"
"ctrl-alt-=" = "editor.fold_expand_recursive"
"ctrl-_" = "editor.fold_collapse_all"
"ctrl-." = "editor.fold_selection"
"alt-," = "editor.fold_collapse"
"alt-." = "editor.fold_expand"
"alt-<" = "editor.fold_collapse_all"
"alt->" = "editor.fold_expand_all"
"alt-shift-f" = "editor.fold_selection"
"alt-{" = "editor.fold_collapse_recursive"
"alt-}" = "editor.fold_expand_recursive"
"ctrl-up" = "editor.scroll_up"
"ctrl-down" = "editor.scroll_down"
"ctrl-alt-left" = "editor.nav_back"
"ctrl-alt-right" = "editor.nav_forward"
"f11" = "editor.toggle_bookmark"
"shift-f11" = "editor.show_bookmarks"
"ctrl-f11" = "editor.toggle_numbered_bookmark"
"ctrl-alt-z" = "editor.revert_change"
# Git blame is View > Git Blame (Ctrl+Alt+B is Implementation(s), as in JetBrains).
# Reformat Code runs the [format] command for the file's language, else asks
# its language server.
"ctrl-alt-l" = "editor.format"
"ctrl-alt-shift-down" = "editor.next_change"
"ctrl-alt-shift-up" = "editor.prev_change"
# Ctrl+Alt+Shift+Up/Down need modifier-aware arrows; F7/Shift+F7 work anywhere.
"f7" = "editor.next_change"
"shift-f7" = "editor.prev_change"
# Language server diagnostics in the file, as Next Highlighted Error.
"f2" = "lsp.next_problem"
"shift-f2" = "lsp.prev_problem"
# Language server navigation. Ctrl+B on a declaration lists its usages;
# Ctrl+click goes to a definition too. Quick Documentation is Ctrl+Q in
# JetBrains, which stays quit here.
"ctrl-b" = "lsp.goto_definition"
# Type Declaration and Implementation(s) as in JetBrains. Ctrl+Shift+B needs
# the kitty protocol (legacy terminals send Ctrl+B); Alt+Shift+B works anywhere.
"ctrl-shift-b" = "lsp.goto_type_definition"
"alt-shift-b" = "lsp.goto_type_definition"
"ctrl-alt-b" = "lsp.goto_implementation"
"alt-f7" = "lsp.find_usages"
"alt-q" = "lsp.quick_doc"
# Parameter Info, as in JetBrains.
"ctrl-p" = "lsp.parameter_info"
# Code completion. Legacy terminals send Ctrl+Space and Ctrl+` both as NUL,
# so in the editor the branches popup is on Ctrl+` only with the kitty
# protocol (or from Git > Branches…).
"ctrl-space" = "lsp.complete"
# Refactoring through the language server: Rename (Shift+F6), Show Context
# Actions (Alt+Enter: quick fixes, imports, refactorings), File Structure
# (Ctrl+F12; the Structure window, Alt+7, stays tree-sitter based).
"shift-f6" = "lsp.rename"
"alt-enter" = "lsp.context_actions"
"ctrl-f12" = "lsp.file_structure"
"esc" = "editor.escape"

# The conflict resolver (Git > Resolve Conflicts) while it is open.
# JetBrains: F7/Shift+F7 step through the changes; Alt+Shift+Left/Right take
# yours or theirs at the caret (after the other side: both). Esc closes it
# after the editor's own Esc steps (find bar, extra carets, selection).
# Accept Yours/Theirs for the whole file are in the header and the action
# palette.
[editor.merge]
"f7" = "merge.next_conflict"
"shift-f7" = "merge.prev_conflict"
"alt-shift-left" = "merge.accept_left"
"alt-shift-right" = "merge.accept_right"
"alt-shift-x" = "merge.ignore"
"alt-shift-a" = "merge.apply_non_conflicting"
"ctrl-enter" = "merge.apply"
# Ctrl+Enter needs the kitty protocol; Alt+Enter is the legacy fallback.
"alt-enter" = "merge.apply"
"esc" = "merge.cancel"

# A completion snippet's tabstops (rust-analyzer's argument placeholders,
# selected one at a time) while they last: Tab selects the next one, the last
# goes on to the snippet's end and finishes it; Shift+Tab goes back. Esc, or
# moving the caret out of the tabstops, finishes it too.
[editor.snippet]
"tab" = "editor.next_tabstop"
"shift-tab" = "editor.prev_tabstop"

# Live templates (snippets): Tab right after a snippet's prefix (the whole
# word before the caret, nothing selected) expands it. An open completion
# popup and a snippet's tabstops (above) take Tab first.
[editor.snippet_prefix]
"tab" = "editor.expand_snippet"

