# The Debug window (Alt+F5): the Frames, Variables and Console tabs. Enter opens the selected frame or the location on the selected line, and in Variables opens or closes the node. Delete removes the selected watch.
[debug]
"up" = "debug.up"
"down" = "debug.down"
"pageup" = "debug.page_up"
"pagedown" = "debug.page_down"
"home" = "debug.home"
"end" = "debug.end"
"enter" = "debug.open"
"right" = "debug.expand"
"left" = "debug.collapse"
"t" = "debug.choose_thread"
"delete" = "debug.remove_watch"
"alt-right" = "tool_window.next_tab"
"alt-left" = "tool_window.prev_tab"
"esc" = "app.focus_editor"

# Above [global] while a debug session is live or starting: Ctrl+F2 stops it first, and the Run task once none is.
[debug.active]
"ctrl-f2" = "debug.stop"

# While a debug session is paused. With the editor focused this table comes before [editor], so F7 steps instead of
# going to the next change; a conflict resolver, the find bar and a snippet come first. In every other panel it comes
# after the panel's own table, so F7 in Git and Local History still goes to their next change, and F8, F9 and Shift+F8
# step from there. Ctrl+Shift+F7 and Alt+Shift+F7 step one instruction (over and into calls); JetBrains binds Alt+Shift+F7 to
# Force Step Into, which jetl does not have. A focused Terminal keeps every key. Omarchy binds bare F9 to push-to-talk when voxtype is installed.
[debug.suspended]
"f9" = "debug.resume"
"f8" = "debug.step_over"
"f7" = "debug.step_into"
"shift-f8" = "debug.step_out"
"ctrl-shift-f7" = "debug.step_over_instruction"
"alt-shift-f7" = "debug.step_into_instruction"
"alt-f10" = "debug.show_execution_point"
"alt-f8" = "debug.evaluate"
"alt-f9" = "debug.run_to_cursor"

# While the Terminal window (Alt+F12) has focus every key goes to the shell
# except the ones in this table, which is the only one consulted there (add
# keys to keep them for jetl, "none" gives one to the shell), and Esc Esc: a
# single Esc reaches the shell, a second one within the double click interval
# focuses the editor.
[terminal]
"alt-f12" = "tool_window.terminal"
"ctrl-shift-up" = "tool_window.stretch_up"
"ctrl-shift-down" = "tool_window.stretch_down"
"alt-shift-m" = "tool_window.maximize"
'ctrl-"' = "tool_window.maximize"
"ctrl-v" = "editor.paste"
# Tabs: another shell, close the active one, switch (Alt+Left/Right no longer reach the shell;
# map them to "none" in your keymap.toml to give them back).
"ctrl-shift-t" = "terminal.new_tab"
"alt-shift-t" = "terminal.new_tab"
"ctrl-f4" = "terminal.close_tab"
"alt-right" = "tool_window.next_tab"
"alt-left" = "tool_window.prev_tab"

# The Local History window (Alt+Shift+H): typing filters the snapshot list,
# Esc clears the filter first.
[local_history]
"up" = "local_history.up"
"down" = "local_history.down"
"pageup" = "local_history.page_up"
"pagedown" = "local_history.page_down"
"home" = "local_history.home"
"end" = "local_history.end"
"left" = "local_history.left"
"right" = "local_history.right"
"tab" = "local_history.next_section"
"enter" = "local_history.open_file"
# The project's files with history; from a file's history, back to them.
# With a filter typed, Backspace edits the filter first.
"backspace" = "local_history.files"
"f7" = "local_history.next_change"
"shift-f7" = "local_history.prev_change"
"alt-u" = "local_history.toggle_diff_layout"
"alt-f" = "local_history.toggle_diff_collapse"
"f5" = "local_history.refresh"
"alt-r" = "local_history.revert"
# The diff's selected changes: F7 picks one, Shift+Up/Down (or a Shift or
# Ctrl click) grows the selection, Ctrl+A takes them all.
"ctrl-alt-z" = "local_history.revert_changes"
"shift-up" = "local_history.extend_selection_up"
"shift-down" = "local_history.extend_selection_down"
"ctrl-a" = "local_history.select_all_changes"
# A line cursor in the diff: Alt+Up/Down moves it, with Shift it grows the
# selected lines, and Revert Changes then reverts only those lines. A double
# click on a changed row sets it; Esc leaves line mode.
"alt-up" = "local_history.line_up"
"alt-down" = "local_history.line_down"
"alt-shift-up" = "local_history.line_extend_up"
"alt-shift-down" = "local_history.line_extend_down"
"alt-l" = "local_history.put_label"
"delete" = "local_history.remove_label"
"shift-f10" = "local_history.context_menu"
"esc" = "local_history.escape"

