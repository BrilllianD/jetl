"alt-m" = "git.toggle_amend"
# In the Commit tab's diff, a line cursor: Alt+Up/Down moves it over the
# changed rows, with Shift it grows the selected lines; Space then stages
# (or unstages) and Ctrl+Alt+Z discards only those lines. A double click on
# a changed row sets it; Esc leaves line mode. Elsewhere Alt+Up/Down recall
# earlier commit messages.
"alt-up" = "git.line_up"
"alt-down" = "git.line_down"
"alt-shift-up" = "git.line_extend_up"
"alt-shift-down" = "git.line_extend_down"
"f5" = "git.refresh"
"alt-c" = "git.tab_commit"
