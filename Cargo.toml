[package]
name = "jetl"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
description = "Lightweight terminal IDE with JetBrains-like UX"
license = "MIT"
authors = ["Bronnikov Aleksandr <brillliand@gmail.com>"]
repository = "https://bitbucket.org/BrilllianD/jetl-ide"
readme = "README.md"
keywords = ["ide", "editor", "terminal", "tui", "git"]
categories = ["command-line-utilities", "text-editors", "development-tools"]

[[bin]]
name = "jetl"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
futures = "0.3"
# Line breaks are \n, \r\n and lone \r only, the ones LSP and every tool jetl talks to count.
# The default `unicode_lines` also breaks at U+000B, U+000C, U+0085, U+2028 and U+2029.
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
tree-sitter = "0.27"
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-scss = { version = "1.0", optional = true }
tree-sitter-xml = { version = "0.7", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-containerfile = { version = "0.9", optional = true }
git2 = { version = "0.21", default-features = false }
imara-diff = "0.2"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
ignore = "0.4"
globset = "0.4"
nucleo-matcher = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
unicode-width = "0.2"
unicode-segmentation = "1.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
ec4rs = "1.2"
notify-debouncer-full = "0.7"
portable-pty = "0.9"
vt100 = "0.16"
lsp-types = "0.97"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = "1.43"

[features]
default = ["lang-rust", "lang-js", "lang-ts", "lang-python", "lang-json", "lang-toml", "lang-bash", "lang-md", "lang-csharp", "lang-yaml", "lang-html", "lang-css", "lang-scss", "lang-xml", "lang-go", "lang-c", "lang-cpp", "lang-java", "lang-php", "lang-lua", "lang-dockerfile"]
lang-rust = ["dep:tree-sitter-rust"]
lang-js = ["dep:tree-sitter-javascript"]
lang-ts = ["dep:tree-sitter-typescript"]
lang-python = ["dep:tree-sitter-python"]
lang-json = ["dep:tree-sitter-json"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-bash = ["dep:tree-sitter-bash"]
lang-md = ["dep:tree-sitter-md"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-yaml = ["dep:tree-sitter-yaml"]
lang-html = ["dep:tree-sitter-html"]
lang-css = ["dep:tree-sitter-css"]
lang-scss = ["dep:tree-sitter-scss"]
lang-xml = ["dep:tree-sitter-xml"]
lang-go = ["dep:tree-sitter-go"]
lang-c = ["dep:tree-sitter-c"]
# The C++ highlight query builds on the C one.
lang-cpp = ["dep:tree-sitter-cpp", "dep:tree-sitter-c"]
lang-java = ["dep:tree-sitter-java"]
lang-php = ["dep:tree-sitter-php"]
lang-lua = ["dep:tree-sitter-lua"]
lang-dockerfile = ["dep:tree-sitter-containerfile"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
