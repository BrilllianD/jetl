[package]
name = "jetl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lightweight terminal IDE with JetBrains-like UX"
license = "MIT"

[[bin]]
name = "jetl"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
futures = "0.3"
ropey = "1.6"
tree-sitter = "0.27"
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
git2 = { version = "0.21", default-features = false }
imara-diff = "0.2"
ignore = "0.4"
nucleo-matcher = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
unicode-width = "0.2"
unicode-segmentation = "1.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"

[features]
default = ["lang-rust", "lang-js", "lang-ts", "lang-python", "lang-json", "lang-toml", "lang-bash", "lang-md"]
lang-rust = ["dep:tree-sitter-rust"]
lang-js = ["dep:tree-sitter-javascript"]
lang-ts = ["dep:tree-sitter-typescript"]
lang-python = ["dep:tree-sitter-python"]
lang-json = ["dep:tree-sitter-json"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-bash = ["dep:tree-sitter-bash"]
lang-md = ["dep:tree-sitter-md"]

[profile.dev.package."*"]
opt-level = 2
