# fmt and clippy on stable; tests on stable and the MSRV (rust-version in
# Cargo.toml). libgit2 is built from the bundled source, no packages needed.
definitions:
  caches:
    cargo-registry: /usr/local/cargo/registry
  steps:
    - step: &lint
        name: fmt and clippy (stable)
        image: rust:1
        caches:
          - cargo-registry
        script:
          - rustup component add rustfmt clippy
          - cargo fmt --check
          - cargo clippy --all-targets -- -D warnings
    - step: &test-stable
        name: test (stable)
        image: rust:1
        caches:
          - cargo-registry
        script:
          - cargo test
    - step: &test-msrv
        name: test (1.90)
        image: rust:1.90
        caches:
          - cargo-registry
        script:
          - cargo test

pipelines:
  default:
    - parallel:
        - step: *lint
        - step: *test-stable
        - step: *test-msrv
